name: Update map

on:
  schedule:
    - cron: "15 5 * * *"   # daily, 05:15 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Natural Earth data
        uses: actions/cache@v4
        with:
          path: data/ref
          key: natural-earth-v1

      - name: Run pipeline
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: make all PY="python -W ignore"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data data/traced
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update travel advice data $(date -u +%F)"
            git push
          fi

      - name: Open an issue for colour changes
        if: hashFiles('data/changes.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Reisadvies gewijzigd $(date -u +%F)" --body-file data/changes.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
